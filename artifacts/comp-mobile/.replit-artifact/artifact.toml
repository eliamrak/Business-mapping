kind = "mobile"
previewPath = "/comp-mobile/"
title = "Comp Modeler Mobile"
version = "1.0.0"
id = "artifacts/comp-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/comp-mobile/" ]
localPort = 8081

[services.development]
run = "pnpm --filter @workspace/comp-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/comp-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/comp-mobile", "run", "serve" ]

[services.env]
PORT = "8081"
BASE_PATH = "/comp-mobile/"
